<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generatore Numeri Casuali</title>
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body class="align-top">
    <div class="container">
        <a href="index.html" class="back-link">← Menu</a>
        <h1>🎲 Generatore Numeri Casuali 🎲</h1>

        <div class="settings">
            <div class="input-group">
                <div class="field-row">
                    <label for="min" class="field-label">Numero Minimo:</label>
                    <input type="number" id="min" value="1" class="field-input">
                </div>
            </div>

            <div class="input-group">
                <div class="field-row">
                    <label for="max" class="field-label">Numero Massimo:</label>
                    <input type="number" id="max" value="90" class="field-input">
                </div>
            </div>

            <div class="input-group">
                <div class="field-row">
                    <label for="count" class="field-label">Quanti numeri:</label>
                    <input type="number" id="count" value="1" min="1" class="field-input">
                </div>
            </div>

            <div class="input-group checkbox-group">
                <label class="checkbox-label">
                    <input type="checkbox" id="uniqueNumbers">
                    <span class="checkmark"></span>
                    ✨ Numeri senza ripetizioni
                    <small class="help-text">Utile per interrogazioni, lotterie ed estrazioni</small>
                </label>
            </div>
        </div>

        <button id="generateBtn" class="generate-btn">Genera Numero</button>

        <div class="result" id="result">
            <p>Premi il pulsante per generare</p>
        </div>

        <div class="history">
            <h3>Cronologia</h3>
            <div id="historyList"></div>
            <button id="clearBtn" class="clear-btn">Cancella Cronologia</button>
        </div>
    </div>

    <script src="generatore.js?v=2"></script>
</body>
</html>
